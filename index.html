<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enbright - 导航</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
    min-height: 100vh;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .logo {
    font-size: 42px;
    font-weight: 700;
    background: linear-gradient(90deg, #00d4ff, #7b2cbf);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  .subtitle {
    color: #8892b0;
    font-size: 14px;
    margin-bottom: 50px;
  }
  .cards {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 800px;
    width: 100%;
  }
  .card {
    flex: 1;
    min-width: 280px;
    max-width: 360px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 40px 32px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
    text-decoration: none;
    color: #fff;
  }
  .card:hover {
    transform: translateY(-8px);
    box-shadow: 0 24px 48px rgba(0,0,0,0.4);
    border-color: rgba(0,212,255,0.3);
  }
  .card .emoji {
    font-size: 56px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 24px;
    margin-bottom: 10px;
  }
  .card p {
    color: #8892b0;
    font-size: 14px;
    line-height: 1.6;
  }
  .card .arrow {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 28px;
    border-radius: 24px;
    background: linear-gradient(135deg, #00d4ff, #7b2cbf);
    font-size: 14px;
    font-weight: 600;
    transition: opacity 0.3s;
  }
  .card:hover .arrow {
    opacity: 0.9;
  }
  .footer {
    margin-top: 50px;
    color: #475569;
    font-size: 12px;
  }
  @media (max-width: 640px) {
    .logo { font-size: 32px; }
    .cards { flex-direction: column; align-items: center; }
    .card { max-width: 100%; width: 100%; }
  }
</style>
</head>
<body>

<div class="logo">Enbright</div>
<div class="subtitle">选择你要访问的页面</div>

<div class="cards">
  <a href="stocks.html" class="card">
    <div class="emoji">📈</div>
    <h2>全球股市监测</h2>
    <p>韩国 · 日本 · 美国<br>实时股价与走势</p>
    <div class="arrow">进入 →</div>
  </a>

  <a href="datong/index.html" class="card">
    <div class="emoji">🚄</div>
    <h2>大同旅行攻略</h2>
    <p>北京 → 大同 3日游<br>云冈石窟 · 悬空寺</p>
    <div class="arrow">进入 →</div>
  </a>
</div>

<div class="footer">www.enbright.uk</div>

</body>
</html>
